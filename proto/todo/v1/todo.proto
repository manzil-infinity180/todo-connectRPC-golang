syntax = "proto3";

package todo.v1;

option go_package = "rahulxf.com/rpc-learning/internal/gen/go/todo/v1;todov1";

message Todo {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  string description = 4;
  bool completed = 5;
  string created_by = 6;
  string assigned_to = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

service TodoService {
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse);
  rpc GetTodo(GetTodoRequest) returns (GetTodoResponse);
  rpc ListTodo(ListTodoRequest) returns (ListTodoResponse);
  rpc UpdateTodo(UpdateTodoRequest) returns (UpdateTodoResponse);
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse);
}

message CreateTodoRequest {
  string workspace_id = 1;
  string title = 2;
  string description = 3;
  optional string assigned_to = 4;
}

message CreateTodoResponse {
  Todo todo = 1;
}

message GetTodoRequest {
  string id = 1;
  string workspace_id = 2;
}

message GetTodoResponse {
  Todo todo = 1;
}

message ListTodoRequest {
  string workspace_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  optional bool completed = 4;
  optional string assigned_to = 5;
}

message ListTodoResponse {
  repeated Todo todos = 1;
  string next_page_token = 2;
}

message UpdateTodoRequest {
  string id = 1;
  string workspace_id = 2;
  optional bool completed = 3;
  optional string title = 4;
  optional string description = 5;
  optional string assigned_to = 6;
}

message UpdateTodoResponse {
  Todo todo = 1;
}

message DeleteTodoRequest {
  string id = 1;
  string workspace_id = 2;
}

message DeleteTodoResponse {
  bool success = 1;
}